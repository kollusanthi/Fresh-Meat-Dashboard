
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMeat | Rider Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-box {
    width: 400px;
    max-width: 100%;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(25,47,82,0.09);
}

/* FreshMeat Branding */
.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    background: #f66b35;
    color: white;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 27px;
    font-weight: bold;
}

.logo-text h1 {
    margin: 0;
    color: #192f52;
    font-size: 24px;
}

.logo-text span {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #64748b;
}

.subtitle {
    text-align: center;
    color: #718096;
    margin-bottom: 28px;
    font-size: 14px;
}

h2 {
    color: #192f52;
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #192f52;
    margin: 18px 0 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #dce1e8;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    background: #f8fafc;
}

input:focus {
    border-color: #f66b35;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 7px;
    background: #f66b35;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e85b27;
}

.message {
    background: #ffe8e8;
    color: #c62828;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 12px;
}

.register-link {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: #64748b;
}

.register-link a {
    color: #f66b35;
    text-decoration: none;
    font-weight: bold;
}

.register-link a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="brand">
        <div class="logo-icon">F</div>
        <div class="logo-text">
            <h1>FreshMeat</h1>
            <span>DELIVERY PORTAL</span>
        </div>
    </div>

    <p class="subtitle">Rider Partner Portal</p>

    <h2>Welcome Back!</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register-link">
        New Rider?
        <a href="{{ url_for('register') }}">Create Account</a>
    </div>

</div>

</body>
</html>
